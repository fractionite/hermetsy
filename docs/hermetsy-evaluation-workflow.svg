<text fill="#5c6770" font-family="Arial,sans-serif" font-size="20" text-anchor="start"><tspan x="60" y="1190">Scope: agent proposals. The separate direct listing editor and bulk find/replace paths are outside this evaluation flow.</tspan></text>
<text fill="#5c6770" font-family="Arial,sans-serif" font-size="20" text-anchor="start"><tspan x="60" y="1230">Acknowledgement is not proof of human identity: an existing write-scoped agent token can also approve. No automatic approval from Jev.</tspan></text>
<text fill="#5c6770" font-family="Arial,sans-serif" font-size="20" text-anchor="start"><tspan x="60" y="1270">Default demo: mock Etsy + rules mode + writes disabled. Jev assesses supplied evidence; it does not measure search demand or predict sales.</tspan></text></svg>
